
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2a1021">
  <title>کلیلەکانی دڵ ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">

    <!-- PAGE 1: KEY HUNT -->
    <section id="gamePage" class="page active">
      <div class="glass-card game-card">
        <div class="chest">🧰</div>
        <h1>٣ کلیل بدۆزەرەوە بۆ کردنەوەی سندوقەکە!</h1>
        <p class="subtitle">بە وردی هەموو چوارچێوەکان تاقی بکەرەوە 💗</p>

        <div id="progress" class="progress-pill">🔑 کلیلە دۆزراوەکان: <b>٠ / ٣</b></div>

        <div id="keyGrid" class="key-grid" aria-label="شوێنی کلیلەکان"></div>

        <button id="resetBtn" class="secondary-btn">↻ دووبارە دەستپێکردن</button>
        <p id="hint" class="hint">هەر جار شوێنی کلیلەکان بە شێوەیەکی هەڕەمەکی دەگۆڕێت.</p>
      </div>
    </section>

    <!-- PAGE 2: LOVE MESSAGE -->
    <section id="lovePage" class="page">
      <div class="glass-card love-card">
        <div class="sticker-wrap">
          <img id="catSticker" src="" alt="ستیکەری دوو پشیلە" class="cat-sticker">
        </div>

        <div class="sparkles">💖✨</div>
        <h2>ساتێکی تایبەت و پڕ لە هەست</h2>

        <div class="message-box">
          <p id="loveMessage"></p>
        </div>

        <button id="backBtn" class="text-btn">↩ گەڕانەوە بۆ کلیلەکان</button>
        <button id="playAudioBtn" class="audio-fallback" type="button" hidden>🎵 لێدانی گۆرانی</button>
      </div>
    </section>

  </main>

  <audio id="loveAudio" preload="auto" playsinline></audio>
  <script src="script.js"></script>
</body>
</html>
